services:
  # ============================================================
  # Base de données dédiée MS4 (Database-per-Service)
  # ============================================================
  postgres-sos:
    image: postgres:16-alpine
    container_name: saferoute-postgres-sos
    environment:
      POSTGRES_DB: sos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_sos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saferoute-net

  # ============================================================
  # Message Broker Asynchrone (S7 - RabbitMQ)
  # UI Management : http://localhost:15672 (guest / guest)
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: saferoute-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - saferoute-net

  # ============================================================
  # Serveur d'Identité & Sécurité (S8 - Keycloak)
  # Console Admin : http://localhost:8180 (admin / admin)
  # Realm auto-importé : saferoute (user/user123 [USER], admin/admin123 [ADMIN, USER])
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: saferoute-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak/saferoute-realm.json:/opt/keycloak/data/import/saferoute-realm.json:ro
    networks:
      - saferoute-net

  # ============================================================
  # Service Discovery (Eureka Server)
  # Dashboard : http://localhost:8761
  # ============================================================
  eureka-server:
    build:
      context: ./infrastructure/eureka-server
    container_name: saferoute-eureka
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - saferoute-net

  # ============================================================
  # MS4 - SoS Service (Imen)
  # Swagger UI : http://localhost:8084/swagger-ui/index.html
  # ============================================================
  sos-service:
    build:
      context: ./microservices/sos-service
    container_name: saferoute-sos-service
    depends_on:
      postgres-sos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-sos:5432/sos_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/saferoute/protocol/openid-connect/certs
      SAFEROUTE_SECURITY_ENABLED: "true"
      SAFEROUTE_FEIGN_USER_ENABLED: "true"
    ports:
      - "8084:8084"
    networks:
      - saferoute-net

  # ============================================================
  # API Gateway (Point d'entrée unique)
  # URL : http://localhost:8080
  # ============================================================
  api-gateway:
    build:
      context: ./infrastructure/api-gateway
    container_name: saferoute-api-gateway
    depends_on:
      eureka-server:
        condition: service_healthy
      sos-service:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URI: http://eureka-server:8761/eureka/
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/saferoute/protocol/openid-connect/certs
      SAFEROUTE_SECURITY_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - saferoute-net

volumes:
  postgres_sos_data:

networks:
  saferoute-net:
    driver: bridge
