spring.application.name=api-gateway
server.port=8080

# ========================================================
# Eureka Client + Liaison Healthcheck Actuator (Chapitre 4)
# ========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# ========================================================
# Discovery Locator (Routage dynamique automatique)
# Exemple: http://localhost:8080/sos-service/sos
# ========================================================
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# ========================================================
# Routes explicites (Routage propre)
# Exemple: http://localhost:8080/sos/** et http://localhost:8080/emergency/**
# ========================================================
spring.cloud.gateway.server.webflux.routes[0].id=sos-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=lb://sos-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/sos/**

spring.cloud.gateway.server.webflux.routes[1].id=emergency-service-route
spring.cloud.gateway.server.webflux.routes[1].uri=lb://sos-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/emergency/**

# ========================================================
# CORS Global (pour la future partie Front-end Web)
# ========================================================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# ========================================================
# Sécurité Keycloak (S8) — désactivée en démo locale, activée en docker/secured
# ========================================================
saferoute.security.enabled=false

# ========================================================
# Observabilité : Spring Boot Actuator (Chapitre 4)
# ========================================================
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=api-gateway
info.app.version=1.0.0
info.app.description=API Gateway Reactive - Point d'entrée unique Safe Route
info.app.team=Safe Route
