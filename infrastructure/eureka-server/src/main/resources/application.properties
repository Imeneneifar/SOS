spring.application.name=eureka-server
server.port=8761

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# En développement uniquement (Chapitre 4) : décommenter pour désactiver l'auto-préservation
# eureka.server.enable-self-preservation=false

# ========================================================
# Observabilité : Spring Boot Actuator (Chapitre 4)
# ========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=eureka-server
info.app.version=1.0.0
info.app.description=Registre de découverte de services Eureka (Safe Route)
info.app.team=Safe Route
