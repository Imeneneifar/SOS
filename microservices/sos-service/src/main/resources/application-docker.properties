# ========================================================
# Safe Route - MS4 SoS Service (Profil Docker / Production)
# Active : PostgreSQL + RabbitMQ + OpenFeign + Keycloak JWT
# ========================================================

# Eureka dans le réseau Docker
eureka.client.service-url.defaultZone=${EUREKA_URI:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

# PostgreSQL (base dédiée MS4 - Database per Service)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-sos:5432/sos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Communication Synchrone OpenFeign vers MS1 (avec repli local si MS1 absent)
saferoute.clients.user-service.enabled=${SAFEROUTE_FEIGN_USER_ENABLED:true}

# Communication Asynchrone RabbitMQ
saferoute.messaging.rabbitmq.enabled=true
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
management.health.rabbit.enabled=true

# Sécurité Keycloak JWT (OAuth2 Resource Server)
saferoute.security.enabled=${SAFEROUTE_SECURITY_ENABLED:true}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/saferoute/protocol/openid-connect/certs}
