# ========================================================
# Safe Route - MS4 SoS Service (Profil PostgreSQL Local)
# Lancer avec : start-sos-postgres.bat
# ou : .\mvnw.cmd spring-boot:run "-Dspring-boot.run.profiles=postgres"
# ========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
