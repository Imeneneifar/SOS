# ========================================================
# Safe Route - MS4 SoS Service (Profil Local Sécurisé)
# Permet de tester Keycloak & RabbitMQ en local hors Docker
# ========================================================

saferoute.security.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/saferoute}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/saferoute/protocol/openid-connect/certs}
