# ========================================================
# Safe Route - MS4 SoS Service Configuration (Mode Local)
# ========================================================

spring.application.name=sos-service
server.port=8084

# ========================================================
# Eureka Client + Liaison Healthcheck Actuator (Chapitre 4)
# ========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health

# ========================================================
# Base de données par défaut (H2 In-Memory pour démo locale)
# Pour PostgreSQL / Docker, lancer avec : --spring.profiles.active=docker
# ========================================================
spring.datasource.url=jdbc:h2:mem:sosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================================
# Communication Synchrone (S6 - OpenFeign vers MS1)
# ========================================================
saferoute.clients.user-service.enabled=false

# ========================================================
# Communication Asynchrone (S7 - RabbitMQ)
# Désactivé par défaut en local (logs simulés) ; activé en profil docker
# ========================================================
saferoute.messaging.rabbitmq.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
management.health.rabbit.enabled=false

# ========================================================
# Sécurité Keycloak (S8 - OAuth2 Resource Server)
# Désactivée en mode démo local ; activée en profil docker ou secured
# ========================================================
saferoute.security.enabled=false

# ========================================================
# Observabilité : Spring Boot Actuator (Chapitre 4)
# Endpoints : /actuator/health, /actuator/info, /actuator/metrics, /actuator/loggers
# Sondes    : /actuator/health/liveness, /actuator/health/readiness
# ========================================================
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=sos-service
info.app.version=1.0.0
info.app.description=Microservice MS4 de gestion des alertes SOS et contacts d'urgence (Safe Route)
info.app.owner=Imen
info.app.team=Safe Route

# ========================================================
# Documentation Swagger / OpenAPI
# ========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
